# Lantern PXE — web layer, HTTP boot root, and the Windows install SMB share.
# DHCP/TFTP runs on the host, not here: install it with
# `sudo host/install.sh "$PWD/data"` once this container has started (see
# README.md).
#
# Builds and runs the FastAPI management UI + API, and the nginx HTTP boot
# root, as rootless Podman containers: no privileged flags, no host
# networking, no socket mounts.
#
#   1. Copy .env.example to .env and edit it.
#   2. podman compose up -d --build   (or: docker compose up -d --build)

services:
  web:
    build:
      context: ./web
      dockerfile: Containerfile
    container_name: lantern-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      DATA_DIR: /data
      BOOTROOT_DIR: /bootroot
      # The generated dnsmasq.conf and the iPXE binaries live under ./data so
      # the host's DHCP/TFTP service can read them (host/install.sh).
      TFTP_DIR: /data/tftp
      IMAGE_DIR: /images
      DNSMASQ_DIR: /data/dnsmasq
      SMB_DIR: /smb
    volumes:
      # :z (shared), not :Z (private) -- the smb container below also reads
      # and writes paths under this tree (data/drivers, data/capture), and a
      # :Z here recursively re-claims the whole tree as web's own private
      # SELinux category on every web restart, silently locking smb back out
      # of subpaths it was separately given :z on (verified: this happened
      # for real, twice, after rebuilding web for an unrelated code change).
      - ./data:/data:z
      # :z (shared), not :Z (private) -- the httpboot container below reads
      # this same bootroot and images volumes. :Z would give each container
      # its own SELinux MCS category and lock the other out (SELinux
      # enforcing: verified this fails with "Permission denied" on files the
      # other container wrote).
      - bootroot:/bootroot:z
      - ${IMAGE_PATH:-./data/images}:/images:z
      # :z (shared) -- the smb container below also reads these two.
      - smbroot:/smb:z
      - ./data/drivers:/smb/drivers:z
    ports:
      - "${WEB_PORT:-8080}:8080"

  httpboot:
    # -unprivileged variant: listens on 8080 and runs as a non-root user by
    # design, instead of nginx's usual "root starts, binds 80, drops to the
    # nginx user" pattern. Rootless Podman can't grant CAP_NET_BIND_SERVICE
    # for that pattern to bind 80 itself, and running it as uid 1000 (below)
    # is also what lets it share the bootroot volume with the web
    # container's own uid-1000 process -- Podman only auto-owns a fresh named
    # volume to one uid, and here that has to be the uid the web app writes
    # as, not root.
    image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
    container_name: lantern-httpboot
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /tmp
    volumes:
      - bootroot:/bootroot:ro,z
      # Raw uploaded ISOs, read-only -- casper's whole-ISO url= boot method
      # and Fedora/RHEL's inst.repo= both fetch the ISO itself over HTTP
      # (services/images.py's iso_url), so it has to be reachable here too,
      # not just inside the web container that uploads/processes it.
      - ${IMAGE_PATH:-./data/images}:/images:ro,z
      - ./httpboot/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./httpboot/docker-entrypoint.d/40-resolver.sh:/docker-entrypoint.d/40-resolver.sh:ro,Z
    ports:
      # PXE clients reach this over plain HTTP with no port in the URL
      # (web/app/services/ipxe.py's ${boot-url} is http://<server_ip>), so the
      # host side is fixed at 80, not a *_PORT env var like the web UI's
      # 8080 -- changing it would silently break every generated boot.ipxe.
      # (The container's own listen port, 8080, is a separate, internal detail
      # -- see httpboot/nginx.conf.)
      - "80:8080"
    depends_on:
      - web

  smb:
    # Windows install media, guest-only, no auth -- matches the
    # `net use ... /user:guest ""` WinPE runs (services/images.py). Runs as
    # root *inside its own container/user namespace* (see smb/Containerfile's
    # top comment for why, and why that's still rootless from the host's
    # side); everything else here follows the same no-privileged-flags rule
    # as the other services.
    build:
      context: ./smb
      dockerfile: Containerfile
    container_name: lantern-smb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      ENABLE_DIAG_CAPTURE: ${ENABLE_DIAG_CAPTURE:-false}
    volumes:
      - smbroot:/install:ro,z
      - ./data/drivers:/install/drivers:ro,z
      - ./data/capture:/capture:z
    ports:
      # WinPE's `net use \\<server>\install\...` (services/images.py) is a
      # raw IP, not a NetBIOS name, so it goes straight for direct-hosted SMB
      # on 445 -- no nmbd/port 139 needed. Fixed at 445, not a *_PORT env var,
      # for the same reason httpboot's 80 is fixed: the generated
      # winpeshl.ini bakes in the plain `\\<server>\install` UNC path with no
      # port, so changing this would silently break every Windows image
      # already processed. Same rootless-port-binding requirement as
      # httpboot's 80 (README.md) -- 445 and 139 are both above the port-80
      # floor that setting already lowers, so no extra sysctl is needed once
      # that one's in place.
      - "445:445"
    depends_on:
      - web

volumes:
  bootroot:
  smbroot:
