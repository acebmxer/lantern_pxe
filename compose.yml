# Lantern PXE — web layer. DHCP/TFTP runs on the host, not here: install it
# with `sudo host/install.sh "$PWD/data"` once this container has started (see
# README.md). HTTP boot root, NFS and SMB aren't built yet (docs/design.md).
#
# Builds and runs the FastAPI management UI + API in a rootless Podman
# container: no privileged flags, no host networking, no socket mounts.
#
#   1. Copy .env.example to .env and edit it.
#   2. podman compose up -d --build   (or: docker compose up -d --build)

services:
  web:
    build:
      context: ./web
      dockerfile: Containerfile
    container_name: lantern-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      DATA_DIR: /data
      BOOTROOT_DIR: /bootroot
      # The generated dnsmasq.conf and the iPXE binaries live under ./data so
      # the host's DHCP/TFTP service can read them (host/install.sh).
      TFTP_DIR: /data/tftp
      IMAGE_DIR: /images
      DNSMASQ_DIR: /data/dnsmasq
      NFS_DIR: /nfs
      SMB_DIR: /smb
    volumes:
      - ./data:/data:Z
      - bootroot:/bootroot
      - ${IMAGE_PATH:-./data/images}:/images:Z
      - nfsroot:/nfs
      - smbroot:/smb
      - ./data/drivers:/smb/drivers:Z
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  bootroot:
  nfsroot:
  smbroot:
