# Lantern PXE — Windows install share. GENERATED base config; entrypoint.sh
# appends [capture] only when ENABLE_DIAG_CAPTURE=true. See services/images.py
# for what WinPE actually mounts: \\<server>\install\<image-id>,
# \\<server>\install\drivers, and (opt-in) \\<server>\capture, all as
# /user:guest "" -- no authentication, matching this config's guest-only setup.

[global]
    workgroup = WORKGROUP
    server string = Lantern PXE install share
    netbios name = LANTERN

    # Guest-only: no real accounts, no domain. Any username WinPE's `net use`
    # offers ("guest") gets mapped to this account instead of being rejected
    # as unknown, which is also what ties every guest file operation to uid
    # 1000 -- the same uid the web app and its volumes already use (see
    # web/Containerfile) instead of the "nobody" account's own permissions.
    #
    # `force user`/`force group` looked like the more direct way to pin that
    # uid, but verified (smbclient + log level=10) that combining force_user
    # with an already guest-mapped session leaves smbd's internal POSIX ACL
    # check denying writes it should allow (check_parent_access_fsp denies
    # mask 0x2 on a directory the mapped uid plainly owns 0755 on) -- some
    # interaction between the two mapping layers smbd doesn't handle
    # cleanly. guest account alone does not hit this and was confirmed
    # working (both read on [install] and write on [capture]).
    security = user
    map to guest = bad user
    guest account = lantern

    # WinPE's SMB client (Windows 10/11-era) speaks SMB2/3 natively; disabling
    # SMB1 removes an unneeded legacy protocol surface.
    server min protocol = SMB2

    # No printing support needed; keeps smbd from probing for a print system
    # that doesn't exist in this container.
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    # Plain rw-r--r--/rwxr-xr-x instead of whatever DOS-attribute mapping
    # would otherwise pick (verified: unmasked writes landed as rwxr--r--,
    # an execute bit on plain diagnostic text files for no reason).
    create mask = 0644
    directory mask = 0755

[install]
    path = /install
    comment = Windows install media
    read only = yes
    guest ok = yes
    browseable = yes
