# HTTP boot root: serves BOOTROOT_DIR (boot.ipxe, kernels/initrds, squashfs,
# wimboot, the XCP-NG GRUB chainload) to PXE clients, and reverse-proxies the
# boot-tracking ping to the web app so the menu only needs one base URL
# (${boot-url} in web/app/services/ipxe.py). See docs/design.md's "Target
# topology" table -- this is the "HTTP boot root (nginx), containerized,
# rootless" row.
server {
    # nginx-unprivileged listens on 8080 internally (rootless: no
    # CAP_NET_BIND_SERVICE, so nginx can't bind 80 itself). compose.yml
    # publishes host port 80 -> this container's 8080, which is where the
    # PXE-facing port actually lives.
    listen 8080;
    server_name _;

    root /bootroot;
    autoindex off;

    # Re-resolve "web" via the container's own /etc/resolv.conf (Podman's or
    # Docker's embedded DNS) on every request, instead of once at worker
    # startup -- a literal hostname in proxy_pass is only resolved at config
    # load, so restarting/recreating the web container (a new IP) left this
    # proxy permanently broken with "502 Host is unreachable" until httpboot
    # itself was restarted too. The resolver's address is written by
    # docker-entrypoint.d/40-resolver.sh from /etc/resolv.conf at startup,
    # since it differs per Docker/Podman network.
    include /tmp/resolver.conf;

    # iPXE fetches this unauthenticated, best-effort ping just before booting
    # an image (services/ipxe.py's _track). X-Real-IP lets track.py recover
    # the real client address instead of this proxy's.
    location /track/ {
        set $web_upstream http://web:8080;
        proxy_pass $web_upstream/track/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Raw uploaded ISOs, mounted separately from /bootroot (see compose.yml).
    # casper's whole-ISO url= method and Fedora/RHEL's inst.repo= both fetch
    # the ISO itself at this path (services/images.py's iso_url).
    location /images/ {
        alias /images/;
    }

    location / {
        try_files $uri =404;
    }
}
